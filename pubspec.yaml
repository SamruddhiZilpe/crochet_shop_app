name: veemadeforyou
description: "A Crochet Products Shopping App"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.10.4

dependencies:
  google_fonts: ^6.2.1
  flutter_bloc: ^9.1.1
  provider: ^6.0.5
  shared_preferences: ^2.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.4.2
  image_picker: ^1.2.2
  cached_network_image: ^3.4.1
  razorpay_flutter: ^1.4.5

  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo/launcher_logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo/launcher_logo.png"
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/images/logo/veemadeforyou.png
    - assets/images/banner/banner.png
    - assets/images/logo/launcher_logo.png

