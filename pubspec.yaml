name: veemadeforyou
description: "A Crochet Products Shopping App"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.10.4

dependencies:
  google_fonts: ^6.2.1
  flutter_bloc: ^9.1.1
  provider: ^6.0.5
  shared_preferences: ^2.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo/launcher_logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo/launcher_logo.png"
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/images/product/avo_crochet.jpeg
    - assets/images/product/bunny_crochet.jpeg
    - assets/images/product/tulip_pot_crochet.jpeg
    - assets/images/product/tulip_crochet.jpeg
    - assets/images/logo/veemadeforyou.png
    - assets/images/banner/banner.png
    - assets/images/logo/launcher_logo.png
    - assets/images/screenshots/home.png
    - assets/images/screenshots/product_details.png
    - assets/images/screenshots/products.png
    - assets/images/screenshots/cart.png
    - assets/images/screenshots/wishlist.png
    - assets/images/screenshots/profile.png
    - assets/images/screenshots/settings.png
    - assets/images/screenshots/checkout.png
